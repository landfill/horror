<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>04:44 — 출구 없음</title>
  <link rel="icon" id="dynamic-favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23050505'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%23cccccc' font-family='serif'>四</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D Viewport -->
  <div id="canvas-container"></div>

  <!-- Subtle Monochrome Vignette Overlay -->
  <div id="fx-overlay" class="fx-overlay">
    <div class="vignette"></div>
  </div>

  <!-- Start Screen (Pure Monochrome) -->
  <div id="start-screen" class="modal-screen active">
    <div class="modal-card">
      <div class="time-stamp">04:44 · NO EXIT</div>
      <h1 class="glitch-title">출구는 없습니다</h1>
      <p class="subtitle">피할 곳도, 끝나는 조건도 없습니다. 모든 층과 복도는 하나로 이어져 있습니다.</p>

      <div class="warning-box">
        <ul>
          <li>본 웹앱은 게임이 아닌 <strong>시청각 공포 체험</strong>입니다.</li>
          <li><strong>헤드폰 또는 이어폰</strong> 착용을 권장합니다 (3D 공간 음향).</li>
          <li>어느 방향으로 걸어도 이전의 공간으로 돌아갈 수 없습니다.</li>
        </ul>
      </div>

      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="opt-subtitles" checked />
          <span>청각 단서 자막 표시</span>
        </label>
      </div>

      <div class="controls-guide">
        <div><strong>PC</strong> : WASD / 방향키 걸어가기 · 마우스 시점 · ESC 정지</div>
        <div><strong>모바일</strong> : 왼쪽 드래그 걸어가기 · 오른쪽 드래그 시점 회전</div>
      </div>

      <div class="start-actions">
        <button id="btn-enter" class="btn-primary">안으로 들어가기</button>
      </div>
    </div>
  </div>

  <!-- Minimalist Atmospheric HUD (No counters, no rules, no elevator buttons) -->
  <div id="hud" class="hud hidden">
    <div class="hud-top-right">
      <button id="btn-pause" class="hud-btn" title="일시정지 (ESC)">∥ 정지</button>
    </div>

    <!-- Whisper / Sound Cue Subtitles -->
    <div id="subtitle-box" class="subtitle-box"></div>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls" class="mobile-controls">
      <div id="joystick-zone" class="joystick-zone">
        <div id="joystick-base" class="joystick-base">
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
      </div>
      <div id="look-zone" class="look-zone"></div>
    </div>
  </div>

  <!-- Minimal Pause Modal -->
  <div id="pause-modal" class="modal-screen">
    <div class="modal-card pause-card">
      <h2>정지됨</h2>
      <p class="subtitle">소리와 시간이 잠시 멈추었습니다.</p>
      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="pause-subtitles" checked />
          <span>청각 단서 자막 표시</span>
        </label>
        <label class="checkbox-label">
          <input type="range" id="volume-slider" min="0" max="100" value="80" />
          <span>음량</span>
        </label>
      </div>
      <div class="start-actions">
        <button id="btn-resume" class="btn-primary">계속 걷기</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
